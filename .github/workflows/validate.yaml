name: Validate Marketplace integration

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant integration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    name: Marketplace catalog validation
    runs-on: ubuntu-latest
    steps:
      # Marketplace uses this upstream validator; no checks are ignored.
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  tests:
    name: Tests on Home Assistant 2026.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
